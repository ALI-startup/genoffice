# The web stack: the shell as the landing page, plus each of the four editors
# standalone on its own port, plus the AI BFF that all five proxy to.
#
#   http://localhost:8080   shell — the landing page. Home, tab strip, and every
#                           editor hosted as a same-origin frame under /app/docs/,
#                           /app/pdf/, /app/slides/ and /app/sheets/ of this origin.
#   http://localhost:9041   docs, standalone on its own origin
#   http://localhost:9042   pdf, standalone on its own origin
#   http://localhost:9043   slides, standalone on its own origin
#   http://localhost:9044   sheets, standalone on its own origin
#
# Each is overridable: SAMUGEN_SHELL_PORT, SAMUGEN_DOCS_PORT,
# SAMUGEN_PDF_PORT, SAMUGEN_SLIDES_PORT, SAMUGEN_SHEETS_PORT.
#
# The BFF is reachable only on the compose network. It holds the provider
# credentials and applies no authentication of its own, so publishing it would
# let anyone who can reach the port spend those credentials — see
# docs/web-migration.md §6.2. The browsers never address it directly either:
# each app's CSP is `connect-src 'self'`, so nginx re-exposes it same-origin
# under /v1/ai.
#
# The hwp-convert service is unpublished for the second half of that reason
# rather than the first: it holds no credential, but the pages cannot address it
# cross-origin either, so nginx re-exposes it under /v1/convert. It turns legacy
# `.hwp` documents into `.hwpx` — the one format conversion this stack cannot do
# in the browser, because the only complete reader of HWP 5.0 is a Java library.
# Stop the service and `.hwpx` still works everywhere; `.hwp` reports that
# conversion is unavailable.
#
#   ./docker/docker.sh up          build and start everything
#   ./docker/docker.sh logs shell  follow one service
#   ./docker/docker.sh down        stop
#
# Copy docker/env.example to .env and fill in a provider credential first; with
# none set the apps load and the AI panel reports no configured provider.
#
# No ssh-agent is needed: the two git+ssh dependencies in package-lock.json are
# fetched over HTTPS by the build. See GIT_SSH_TO_HTTPS in the Dockerfile for
# what to change if either repository becomes private.

name: samugen

x-web-build: &web-build
  context: .
  dockerfile: Dockerfile
  target: web

x-web-service: &web-service
  image: samugen/web:local
  build: *web-build
  depends_on:
    ai-bff:
      condition: service_healthy
    hwp-convert:
      # `service_started`, not `service_healthy`: the converter's health check
      # asks the JVM, and a stack whose Hangul conversion is unavailable should
      # still serve every other format rather than refusing to come up.
      condition: service_started
  restart: unless-stopped
  networks:
    - samugen

# Every web container proxies the same two upstreams on its own origin. The
# paths must match the constants the browser calls (AI_BFF_BASE_PATH and
# CONVERT_BASE_PATH in packages/platform-web); `./docker/docker.sh check`
# verifies that.
x-web-upstreams: &web-upstreams
  SAMUGEN_WEB_PORT: '8080'
  SAMUGEN_AI_BFF_UPSTREAM: http://ai-bff:8788
  SAMUGEN_AI_BFF_PATH: /v1/ai
  SAMUGEN_CONVERT_UPSTREAM: http://hwp-convert:8789
  SAMUGEN_CONVERT_PATH: /v1/convert

services:
  ai-bff:
    image: samugen/ai-bff:local
    build:
      context: .
      dockerfile: Dockerfile
      target: bff
    environment:
      # Inside a container, loopback is the container. The service is kept
      # private by having no `ports:` entry, not by its bind address.
      SAMUGEN_AI_BFF_HOST: 0.0.0.0
      SAMUGEN_AI_BFF_PORT: '8788'
    env_file:
      # Provider keys and models. Optional so the stack still starts without it.
      - path: .env
        required: false
    expose:
      - '8788'
    restart: unless-stopped
    networks:
      - samugen

  # `.hwp` → `.hwpx`. The only image in this stack with a JVM in it.
  hwp-convert:
    image: samugen/hwp-convert:local
    build:
      context: .
      dockerfile: Dockerfile
      target: hwpconvert
    environment:
      # Loopback is the container; kept private by having no `ports:` entry.
      SAMUGEN_HWP_CONVERT_HOST: 0.0.0.0
      SAMUGEN_HWP_CONVERT_PORT: '8789'
    expose:
      - '8789'
    restart: unless-stopped
    networks:
      - samugen

  # The entry point.
  shell:
    <<: *web-service
    container_name: samugen-shell
    environment:
      <<: *web-upstreams
      SAMUGEN_WEB_ROOT: /srv/shell
    ports:
      - '${SAMUGEN_SHELL_PORT:-8080}:8080'

  # Standalone docs, on its own origin rather than as a frame of the shell.
  docs:
    <<: *web-service
    container_name: samugen-docs
    environment:
      <<: *web-upstreams
      SAMUGEN_WEB_ROOT: /srv/docs
    ports:
      - '${SAMUGEN_DOCS_PORT:-9041}:8080'

  # Standalone pdf, likewise.
  pdf:
    <<: *web-service
    container_name: samugen-pdf
    environment:
      <<: *web-upstreams
      SAMUGEN_WEB_ROOT: /srv/pdf
    ports:
      - '${SAMUGEN_PDF_PORT:-9042}:8080'

  # Standalone sheets, likewise.
  sheets:
    <<: *web-service
    container_name: samugen-sheets
    environment:
      <<: *web-upstreams
      SAMUGEN_WEB_ROOT: /srv/sheets
    ports:
      - '${SAMUGEN_SHEETS_PORT:-9044}:8080'

  # Standalone slides, likewise.
  slides:
    <<: *web-service
    container_name: samugen-slides
    environment:
      <<: *web-upstreams
      SAMUGEN_WEB_ROOT: /srv/slides
    ports:
      - '${SAMUGEN_SLIDES_PORT:-9043}:8080'

networks:
  samugen:
    driver: bridge
